name: Deploy LASE Properties to GitHub Pages

on:
  push:
    branches:
      - claude/sleepy-cray-ifhpvr
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/sleepy-cray-ifhpvr

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          cname: lase-properties.vercel.app
