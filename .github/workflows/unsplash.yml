name: Fetch Unsplash photos
on:
  push:
    branches: [claude/eloquent-curie-0n2ugs]
    paths: ['refs/tools/unsplash.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Download
        run: OUT=refs/unsplash node refs/tools/unsplash.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refs/unsplash
          git diff --cached --quiet || git commit -m "Add Unsplash reference photos"
          git pull --rebase origin claude/eloquent-curie-0n2ugs && git push
