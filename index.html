<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leonel Meneses - Entrepreneur & Visionary</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'San Francisco', 'Segoe UI', sans-serif;
            background: #000000;
            color: #fff;
            overflow-y: auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image:
                radial-gradient(1px 1px at 20% 30%, white, rgba(255,255,255,0)),
                radial-gradient(1px 1px at 60% 70%, white, rgba(255,255,255,0)),
                radial-gradient(1.5px 1.5px at 50% 50%, white, rgba(255,255,255,0)),
                radial-gradient(1px 1px at 80% 10%, white, rgba(255,255,255,0)),
                radial-gradient(1px 1px at 10% 90%, white, rgba(255,255,255,0)),
                radial-gradient(1px 1px at 40% 80%, white, rgba(255,255,255,0)),
                radial-gradient(0.5px 0.5px at 90% 60%, white, rgba(255,255,255,0)),
                radial-gradient(1px 1px at 30% 20%, white, rgba(255,255,255,0)),
                radial-gradient(0.5px 0.5px at 70% 40%, white, rgba(255,255,255,0)),
                radial-gradient(1px 1px at 15% 50%, white, rgba(255,255,255,0)),
                radial-gradient(1.5px 1.5px at 85% 80%, white, rgba(255,255,255,0)),
                radial-gradient(0.5px 0.5px at 25% 60%, white, rgba(255,255,255,0)),
                radial-gradient(1px 1px at 75% 25%, white, rgba(255,255,255,0));
            background-size: 100% 100%;
            background-position: 0 0;
            opacity: 0.6;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: none;
        }

        .globe-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            width: 400px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .globe-image {
            width: 100%;
            height: 100%;
            animation: spinGlobe 60s linear infinite;
            object-fit: contain;
        }

        @keyframes spinGlobe {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .header {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
        }

        .profile-pic {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #d4af37;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.6); }
            50% { box-shadow: 0 0 30px rgba(212, 175, 55, 1); }
        }

        .header h1 {
            font-size: 2em;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 0.95em;
            color: #ffffff;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .location {
            display: none;
        }

        .stars-container {
            position: absolute;
            width: 100%;
            height: 100%;
            perspective: 1000px;
        }

        .star {
            position: absolute;
            left: 50%;
            top: 50%;
            transform-origin: center;
            cursor: pointer;
            user-select: none;
            transition: filter 0.3s ease;
        }

        .star.hovered {
            filter: brightness(1.3);
        }

        .star-name {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2em;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.8);
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            text-decoration: none;
            display: block;
            cursor: pointer;
            transition: opacity 0.3s ease;
            opacity: 1;
        }

        .star.hovered .star-name {
            opacity: 0;
            pointer-events: none;
        }

        .star-finger {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5em;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .star.hovered .star-finger {
            opacity: 1;
            pointer-events: auto;
        }

        .star-finger:hover {
            filter: brightness(1.3);
        }

        .footer {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            font-family: -apple-system, BlinkMacSystemFont, 'San Francisco', 'Segoe UI', sans-serif;
        }

        .footer-content {
            font-size: 0.9em;
            color: #ffffff;
            font-weight: 400;
        }

        .footer-email {
            margin-top: 8px;
            font-weight: 500;
            color: #ffffff;
        }

        .footer-email a {
            color: inherit;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .footer-email a:hover {
            text-shadow: 0 0 10px rgba(0, 255, 200, 0.8);
        }

        .linkedin-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: rgba(0, 119, 181, 0.9);
            border: 2px solid #0077B5;
            border-radius: 50px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .linkedin-btn:hover {
            background: rgba(0, 119, 181, 1);
            box-shadow: 0 0 20px rgba(0, 119, 181, 0.8);
            transform: scale(1.05);
        }

        .linkedin-icon {
            width: 20px;
            height: 20px;
        }

        .companies-section {
            width: 100%;
            min-height: 100vh;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #000000 0%, #0a0a1a 100%);
            position: relative;
            z-index: 3;
        }

        .companies-section h2 {
            font-size: 2.5em;
            font-weight: 600;
            margin-bottom: 60px;
            text-align: center;
            letter-spacing: 1px;
            animation: slideInDown 0.8s ease-out;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(60px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .companies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
            max-width: 1200px;
            width: 100%;
        }

        .company-card {
            background: rgba(15, 15, 35, 0.9);
            border: 2px solid rgba(0, 255, 136, 0.3);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            position: relative;
            opacity: 0;
            animation: slideInUp 0.6s ease-out forwards;
        }

        .company-card:nth-child(1) { animation-delay: 0.1s; }
        .company-card:nth-child(2) { animation-delay: 0.2s; }
        .company-card:nth-child(3) { animation-delay: 0.3s; }
        .company-card:nth-child(4) { animation-delay: 0.4s; }
        .company-card:nth-child(5) { animation-delay: 0.5s; }
        .company-card:nth-child(6) { animation-delay: 0.6s; }

        .company-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.15) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: 1;
        }

        .company-card-preview {
            width: 100%;
            height: 200px;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .company-card-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .company-card-content {
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-grow: 1;
            position: relative;
            z-index: 2;
        }

        .company-card-name {
            font-size: 1.6em;
            font-weight: 700;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            letter-spacing: 1px;
        }

        .company-card:hover {
            border-color: rgba(0, 255, 136, 0.8);
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 60px rgba(0, 255, 136, 0.25);
        }

        .company-card:hover::before {
            opacity: 1;
        }

        .company-card:hover .company-card-preview img {
            transform: scale(1.05);
        }

        .company-card-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: rgba(0, 255, 136, 0.2);
            border: 2px solid rgba(0, 255, 136, 0.5);
            border-radius: 8px;
            color: #00ff88;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
            width: fit-content;
            position: relative;
            z-index: 2;
        }

        .company-card-link:hover {
            background: rgba(0, 255, 136, 0.4);
            border-color: rgba(0, 255, 136, 1);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
        }

        .company-card-arrow {
            font-size: 1.2em;
            transition: transform 0.3s ease;
        }

        .company-card-link:hover .company-card-arrow {
            transform: translateX(5px);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .header p {
                font-size: 0.9em;
            }

            .star-name {
                font-size: 0.95em;
                padding: 6px 10px;
            }

            .linkedin-btn {
                top: 10px;
                right: 10px;
                font-size: 0.9em;
            }

            .companies-section {
                padding: 40px 20px;
            }

            .companies-section h2 {
                font-size: 1.8em;
                margin-bottom: 40px;
            }

            .companies-grid {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            .company-card {
                margin-bottom: 10px;
            }

            .company-card-preview {
                height: 150px;
            }

            .company-card-content {
                padding: 20px;
            }

            .company-card-name {
                font-size: 1.4em;
            }
        }
    </style>
</head>
<body>
    <canvas id="globeCanvas"></canvas>

    <div class="globe-container">
        <img src="https://images.unsplash.com/photo-1446776653964-20c1d3a81b06?w=400&h=400&fit=crop" alt="Disco Ball Earth" class="globe-image">
    </div>

    <div class="container">

        <div class="header">
            <div style="position: relative; width: 80px; height: 80px; margin: 0 auto 15px;">
                <img src="https://media.licdn.com/dms/image/v2/D4D03AQGKNaEp0dIRXA/profile-displayphoto-shrink_200_200/profile-displayphoto-shrink_200_200/0/1697739451932?e=2147483647&v=beta&t=LpPz_mLqm-vVMVPM3YLTcL5xPgKbPNLVjqBKJ9xYNss" alt="Leonel Meneses" class="profile-pic" id="profileImg">
            </div>
            <h1>LEONEL MENESES</h1>
            <p>Entrepreneur • Visionary • Humanitarian</p>
        </div>

        <div class="stars-container" id="starsContainer"></div>

        <a href="https://www.linkedin.com/in/leonel-meneses-4700152b/" target="_blank" class="linkedin-btn">
            <svg class="linkedin-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
            </svg>
            LinkedIn
        </a>
    </div>

    <div class="footer">
        <div class="footer-content">Connect with me</div>
        <div class="footer-email">
            <a href="mailto:leoneltelesmeneses@gmail.com">leoneltelesmeneses@gmail.com</a>
        </div>
    </div>

    <div class="companies-section" id="companiesSection">
        <h2>My Companies</h2>
        <div class="companies-grid" id="companiesGrid"></div>
    </div>

    <script>
        const canvas = document.getElementById('globeCanvas');
        const ctx = canvas.getContext('2d');
        const starsContainer = document.getElementById('starsContainer');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let rotation = 0;

        const companies = [
            { name: 'SHAKE', link: 'https://app.shakeapp.today/', angle: 0 },
            { name: 'WHAAT', link: 'https://whaat.app/', angle: 72 },
            { name: 'HOLLYAI', link: 'https://hollyai.app/', angle: 144 },
            { name: 'SKIPFEE', link: 'https://skipfee.co/', angle: 216 },
            { name: 'MAMACITA', link: 'https://mamacitacacao.com/', angle: 288 },
            { name: 'COMBO', link: 'https://combo.shakeapp.today/', angle: 60 }
        ];

        let hoveredStar = null;
        let leaveTimeout = null;

        function createStars() {
            starsContainer.innerHTML = '';
            companies.forEach(company => {
                const star = document.createElement('div');
                star.className = 'star';
                star.innerHTML = `
                    <a href="${company.link}" target="_blank" class="star-name">${company.name}</a>
                    <div class="star-finger">👉</div>
                `;

                star.addEventListener('mouseenter', () => {
                    // Cancel any pending leave
                    if (leaveTimeout) {
                        clearTimeout(leaveTimeout);
                        leaveTimeout = null;
                    }

                    hoveredStar = company;
                    // Remove hovered class from all other stars
                    document.querySelectorAll('.star').forEach(s => {
                        if (s !== star) {
                            s.classList.remove('hovered');
                        }
                    });
                    // Add to current star
                    star.classList.add('hovered');
                });

                star.addEventListener('mouseleave', () => {
                    // Debounce the leave event to handle rapid enter/leave due to animation
                    leaveTimeout = setTimeout(() => {
                        if (hoveredStar === company) {
                            hoveredStar = null;
                            star.classList.remove('hovered');
                        }
                        leaveTimeout = null;
                    }, 100);
                });

                starsContainer.appendChild(star);
                company.element = star;
            });
        }

        function updateStarPositions() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(canvas.width, canvas.height) * 0.35;

            companies.forEach(company => {
                let angle;

                // Stop rotation when hovered
                if (hoveredStar === company) {
                    angle = company.angle * Math.PI / 180;
                } else {
                    angle = (company.angle + rotation * 0.5) * Math.PI / 180;
                }

                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;

                company.element.style.left = x + 'px';
                company.element.style.top = y + 'px';
                company.element.style.transform = `translate(-50%, -50%)`;
            });
        }

        function animate() {
            updateStarPositions();
            rotation += 0.08;
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        createStars();
        animate();

        // Company preview images (using preview service)
        const companyPreviews = {
            'SHAKE': 'https://api.microlink.io/?url=https://app.shakeapp.today/&screenshot=true&meta=false&embed=screenshot.url',
            'WHAAT': 'https://api.microlink.io/?url=https://whaat.app/&screenshot=true&meta=false&embed=screenshot.url',
            'HOLLYAI': 'https://api.microlink.io/?url=https://hollyai.app/&screenshot=true&meta=false&embed=screenshot.url',
            'SKIPFEE': 'https://api.microlink.io/?url=https://skipfee.co/&screenshot=true&meta=false&embed=screenshot.url',
            'MAMACITA': 'https://api.microlink.io/?url=https://mamacitacacao.com/&screenshot=true&meta=false&embed=screenshot.url',
            'COMBO': 'https://api.microlink.io/?url=https://combo.shakeapp.today/&screenshot=true&meta=false&embed=screenshot.url'
        };

        // Populate companies grid
        const companiesGrid = document.getElementById('companiesGrid');
        companies.forEach(company => {
            const card = document.createElement('div');
            card.className = 'company-card';

            const previewImg = document.createElement('img');
            previewImg.src = `https://images.unsplash.com/photo-1460925895917-adbf77c4b772?w=600&h=300&fit=crop`;
            previewImg.alt = `${company.name} preview`;

            card.innerHTML = `
                <div class="company-card-preview">
                    <img src="https://images.unsplash.com/photo-1460925895917-adbf77c4b772?w=600&h=300&fit=crop" alt="${company.name}" />
                </div>
                <div class="company-card-content">
                    <div class="company-card-name">${company.name}</div>
                    <a href="${company.link}" target="_blank" class="company-card-link">
                        Visit Site <span class="company-card-arrow">→</span>
                    </a>
                </div>
            `;

            card.addEventListener('click', () => {
                window.open(company.link, '_blank');
            });

            companiesGrid.appendChild(card);
        });
    </script>
</body>
</html>
