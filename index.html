<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leonel Meneses - Entrepreneur & Visionary</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'San Francisco', 'Segoe UI', sans-serif;
            background: #0a0e27;
            color: #fff;
            overflow: hidden;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: none;
        }

        .globe-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            width: 400px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .globe-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: flipGlobe 4s ease-in-out infinite;
        }

        @keyframes flipGlobe {
            0%, 100% { opacity: 1; }
            49% { opacity: 1; }
            50% { opacity: 0; }
            51% { opacity: 0; }
            100% { opacity: 1; }
        }

        .globe-image.flip2 {
            position: absolute;
            animation: flipGlobe2 4s ease-in-out infinite;
        }

        @keyframes flipGlobe2 {
            0%, 100% { opacity: 0; }
            49% { opacity: 0; }
            50% { opacity: 1; }
            51% { opacity: 1; }
            100% { opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .header {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
        }

        .profile-pic {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .header h1 {
            font-size: 2em;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 0.95em;
            color: #ffffff;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .location {
            display: none;
        }

        .stars-container {
            position: absolute;
            width: 100%;
            height: 100%;
            perspective: 1000px;
        }

        .star {
            position: absolute;
            left: 50%;
            top: 50%;
            transform-origin: center;
            cursor: pointer;
            user-select: none;
            transition: filter 0.3s ease;
        }

        .star.hovered {
            filter: brightness(1.3);
        }

        .star-name {
            font-size: 1.2em;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.8);
            transition: all 0.3s ease;
            opacity: 0.8;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
        }

        .star:hover .star-name {
            opacity: 0;
            pointer-events: none;
        }

        .star-link {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            font-size: 3em;
            cursor: pointer;
        }

        .star:hover .star-link {
            opacity: 1;
            pointer-events: auto;
        }

        .star-link a {
            text-decoration: none;
            display: block;
            line-height: 1;
            transition: transform 0.2s ease;
        }

        .star-link a:hover {
            transform: scale(1.2);
        }

        .footer {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            font-family: -apple-system, BlinkMacSystemFont, 'San Francisco', 'Segoe UI', sans-serif;
        }

        .footer-content {
            font-size: 0.9em;
            color: #ffffff;
            font-weight: 400;
        }

        .footer-email {
            margin-top: 8px;
            font-weight: 500;
            color: #ffffff;
        }

        .footer-email a {
            color: inherit;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .footer-email a:hover {
            text-shadow: 0 0 10px rgba(0, 255, 200, 0.8);
        }

        .linkedin-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: rgba(0, 119, 181, 0.9);
            border: 2px solid #0077B5;
            border-radius: 50px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .linkedin-btn:hover {
            background: rgba(0, 119, 181, 1);
            box-shadow: 0 0 20px rgba(0, 119, 181, 0.8);
            transform: scale(1.05);
        }

        .linkedin-icon {
            width: 20px;
            height: 20px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .header p {
                font-size: 0.9em;
            }

            .star-name {
                font-size: 0.95em;
                padding: 6px 10px;
            }

            .linkedin-btn {
                top: 10px;
                right: 10px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <canvas id="globeCanvas"></canvas>

    <div class="globe-container">
        <img src="https://images.unsplash.com/photo-1446776877081-d282a0f896e2?w=500&h=500&fit=crop" alt="Disco Ball Earth 1" class="globe-image">
        <img src="https://images.unsplash.com/photo-1446776653964-20c1d3a81b06?w=500&h=500&fit=crop" alt="Disco Ball Earth 2" class="globe-image flip2">
    </div>

    <div class="container">

        <div class="header">
            <div style="position: relative; width: 80px; height: 80px; margin: 0 auto 15px;">
                <img src="https://media.licdn.com/dms/image/v2/D4D03AQGKNaEp0dIRXA/profile-displayphoto-shrink_200_200/profile-displayphoto-shrink_200_200/0/1697739451932?e=2147483647&v=beta&t=LpPz_mLqm-vVMVPM3YLTcL5xPgKbPNLVjqBKJ9xYNss" alt="Leonel Meneses" class="profile-pic" id="profileImg">
            </div>
            <h1>LEONEL MENESES</h1>
            <p>Entrepreneur • Visionary • Humanitarian</p>
        </div>

        <div class="stars-container" id="starsContainer"></div>

        <a href="https://www.linkedin.com/in/leonel-meneses-4700152b/" target="_blank" class="linkedin-btn">
            <svg class="linkedin-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
            </svg>
            LinkedIn
        </a>
    </div>

    <div class="footer">
        <div class="footer-content">Connect with me</div>
        <div class="footer-email">
            <a href="mailto:leoneltelesmeneses@gmail.com">leoneltelesmeneses@gmail.com</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('globeCanvas');
        const ctx = canvas.getContext('2d');
        const starsContainer = document.getElementById('starsContainer');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let rotation = 0;

        const companies = [
            { name: 'SHAKE', link: 'https://app.shakeapp.today/', angle: 0 },
            { name: 'WHAAT', link: 'https://whaat.app/', angle: 72 },
            { name: 'HOLLYAI', link: 'https://hollyai.app/', angle: 144 },
            { name: 'SKIPFEE', link: 'https://skipfee.co/', angle: 216 },
            { name: 'MAMACITA', link: 'https://mamacitacacao.com/', angle: 288 }
        ];

        let hoveredStar = null;

        function createStars() {
            starsContainer.innerHTML = '';
            companies.forEach(company => {
                const star = document.createElement('div');
                star.className = 'star';
                star.innerHTML = `
                    <div class="star-name">${company.name}</div>
                    <div class="star-link">
                        <a href="${company.link}" target="_blank">👉</a>
                    </div>
                `;

                star.addEventListener('mouseenter', () => {
                    hoveredStar = company;
                    star.classList.add('hovered');
                });

                star.addEventListener('mouseleave', () => {
                    hoveredStar = null;
                    star.classList.remove('hovered');
                });

                starsContainer.appendChild(star);
                company.element = star;
            });
        }

        function updateStarPositions() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(canvas.width, canvas.height) * 0.35;

            companies.forEach(company => {
                let angle;

                // Stop rotation when hovered
                if (hoveredStar === company) {
                    angle = company.angle * Math.PI / 180;
                } else {
                    angle = (company.angle + rotation * 0.5) * Math.PI / 180;
                }

                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;

                company.element.style.left = x + 'px';
                company.element.style.top = y + 'px';
                company.element.style.transform = `translate(-50%, -50%) scale(${1 + Math.cos(angle) * 0.2})`;
            });
        }

        function animate() {
            updateStarPositions();
            rotation += 0.08;
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        createStars();
        animate();
    </script>
</body>
</html>
