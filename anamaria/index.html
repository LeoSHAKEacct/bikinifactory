<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ana Maria</title>
<meta name="description" content="Ana Maria — vlogger. Mira mis videos y escríbeme por WhatsApp.">
<meta name="theme-color" content="#0b0709">
<meta property="og:title" content="Ana Maria">
<meta property="og:description" content="Vlogger · YouTube · WhatsApp">
<meta property="og:image" content="ana-maria.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0709; --panel:rgba(255,255,255,.05); --line:rgba(255,255,255,.12);
  --text:#f6eef0; --muted:#b9a8ad; --rose:#e2577a; --rose2:#ffb3c4;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse at top,rgba(226,87,122,.22),transparent 60%);
  display:flex;justify-content:center;padding:32px 16px 48px;
}
a{color:inherit;text-decoration:none}
.card{width:100%;max-width:440px;text-align:center}
.photo{
  width:100%;aspect-ratio:4/5;border-radius:24px;overflow:hidden;
  border:1px solid var(--line);box-shadow:0 30px 80px -20px rgba(226,87,122,.35);
}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
h1{
  font-family:"Playfair Display",serif;font-weight:600;font-size:clamp(40px,11vw,56px);
  margin:28px 0 6px;letter-spacing:-.01em;
  background:linear-gradient(100deg,#fff,var(--rose2) 50%,var(--rose));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.tag{color:var(--muted);font-size:15px;letter-spacing:.18em;text-transform:uppercase}
.links{display:flex;flex-direction:column;gap:12px;margin-top:32px}
.btn{
  display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:16px;
  background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:16px;
  transition:transform .15s,background .15s,border-color .15s;
}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.25)}
.btn svg{width:24px;height:24px;flex:none}
.btn span{flex:1;text-align:left}
.btn .arrow{opacity:.5;font-weight:400}
.btn.wa{background:#25d366;border-color:#25d366;color:#06200f}
.btn.wa:hover{background:#2ee672}
.btn.soon{opacity:.45;pointer-events:none}
footer{margin-top:40px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main class="card">
  <div class="photo"><img src="ana-maria.jpg" alt="Ana Maria"></div>

  <h1>Ana Maria</h1>
  <p class="tag">Vlogger</p>

  <nav class="links">

      <span>WhatsApp</span><span class="arrow">→</span>
    </a>

    <!-- TODO: replace href="#" with her YouTube channel URL and remove class "soon" -->
    <a class="btn soon" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="#ff0033"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8z"/><path fill="#fff" d="M9.6 15.6 15.8 12 9.6 8.4z"/></svg>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
      <span>Instagram</span><span class="arrow">Pronto</span>

      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 5.8A4.3 4.3 0 0 1 15.5 3h-3.1v12.4a2.6 2.6 0 1 1-1.8-2.5V9.7a5.7 5.7 0 1 0 4.9 5.7V9a7.4 7.4 0 0 0 4.3 1.4V7.3a4.3 4.3 0 0 1-3.2-1.5z"/></svg>
      <span>TikTok</span><span class="arrow">Pronto</span>
    </a>
  </nav>

  <footer>© <script>document.write(new Date().getFullYear())</script> Ana Maria</footer>
</main>
</body>
</html>
