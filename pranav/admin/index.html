<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Leads — Pranav Sheth</title>
<meta name="theme-color" content="#05070c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070c;--panel:#0d121c;--line:rgba(255,255,255,.09);--text:#eef1f7;--muted:#8b93a7;--gold:#d8b46a;--gold2:#f3dca4;--green:#25d366;--amber:#f5b94a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
.logo{font:700 17px "Space Grotesk";letter-spacing:.14em}.logo span{color:var(--gold)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--text);font:600 13px "Space Grotesk";cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:linear-gradient(100deg,var(--gold2),var(--gold));color:#1a1205;border-color:transparent}
.btn.wa{background:var(--green);border-color:var(--green);color:#fff}
.btn.red{color:#ff8a8a}
#login{max-width:380px;margin:12vh auto 0;padding:32px;border:1px solid rgba(216,180,106,.4);border-radius:22px;background:var(--panel)}
#login h1{font:600 22px "Space Grotesk";margin:14px 0 18px}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#070a11;color:var(--text);font:400 15px Inter}
input:focus{outline:0;border-color:var(--gold)}
#login .btn{width:100%;justify-content:center;margin-top:14px;padding:13px}
.err{color:#ff8a8a;font-size:14px;margin-top:10px;min-height:20px}
#app{display:none}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.bar .r{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat{padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:var(--panel);cursor:pointer}
.stat.on{border-color:var(--gold)}
.stat b{display:block;font:700 30px "Space Grotesk"}
.stat span{color:var(--muted);font-size:13px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filters input{flex:1;min-width:200px}
.filters select{width:auto}
.list{display:grid;gap:12px}
.lead{padding:18px 20px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}
.lead.handled{opacity:.55}
.lead .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.lead h3{font:600 18px "Space Grotesk"}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font:600 11px "Space Grotesk";letter-spacing:.06em;margin-right:6px}
.tag.sub{background:rgba(37,211,102,.14);color:#5ee08f}
.tag.ab{background:rgba(245,185,74,.14);color:var(--amber)}
.tag.now{background:rgba(79,216,255,.14);color:#7fe0ff}
.tag.kind{border:1px solid var(--line);color:var(--muted)}
.when{color:var(--muted);font-size:13px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 20px;margin:14px 0}
.grid div{font-size:14px}.grid small{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.note{font-size:14px;color:#c9d0dc;white-space:pre-wrap;margin-bottom:12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acts label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-left:auto;cursor:pointer}
.acts input{width:auto}
.empty,.setup{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
.setup{text-align:left;color:#c9d0dc}.setup ol{margin:10px 0 0 20px}.setup li{margin:6px 0}
@media(max-width:600px){.stats{grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px}.stat b{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <form id="login">
    <div class="logo">PRANAV<span>.</span>SHETH</div>
    <h1>Leads admin</h1>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn gold" type="submit">Sign in</button>
    <p class="err" id="lerr"></p>
  </form>

  <div id="app">
    <div class="bar">
      <div class="logo">PRANAV<span>.</span>SHETH <span style="color:var(--muted);letter-spacing:0;font:500 14px Inter;margin-left:8px">Leads</span></div>
      <div class="r"><button class="btn" id="refresh" type="button">↻ Refresh</button><button class="btn" id="csv" type="button">⬇ Export CSV</button><button class="btn" id="out" type="button">Sign out</button></div>
    </div>
    <div class="stats">
      <div class="stat on" data-f="all"><b id="cAll">0</b><span>All</span></div>
      <div class="stat" data-f="submitted"><b id="cSub">0</b><span>Submitted</span></div>
      <div class="stat" data-f="abandoned"><b id="cAb">0</b><span>Abandoned</span></div>
    </div>
    <div class="filters">
      <input id="q" placeholder="Search name, email, phone, area…">
      <select id="kind"><option value="">All forms</option><option value="contact">Contact form</option><option value="booking">Consultation bookings</option></select>
      <select id="hand"><option value="">Handled and open</option><option value="open">Open only</option><option value="handled">Handled only</option></select>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FRESH = 15 * 60 * 1000;   // an unfinished form untouched for 15 minutes counts as abandoned
const LABELS = { goal: "Interested in", type: "Property type", budget: "Budget (AED)", timeline: "Timeline", email: "Email", phone: "WhatsApp", city: "City / Country", slotDubai: "Requested time", topic: "Topic", how: "Meeting", tz: "Their timezone" };
let PW = "", leads = [], filter = "all";
try { PW = sessionStorage.getItem("pranav-admin") || ""; } catch (_) {}

async function call(body) {
  const r = await fetch("/api/leads", { method: "POST", headers: { "Content-Type": "application/json", "x-admin-password": PW }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || "Something went wrong."); e.status = r.status; throw e; }
  return j;
}
const state = l => l.status === "submitted" ? "submitted" : (Date.now() - l.updated < FRESH ? "now" : "abandoned");
const fmt = t => new Date(t).toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

async function login(pw) {
  PW = pw; const r = await call({ action: "login" });
  try { sessionStorage.setItem("pranav-admin", PW); } catch (_) {}
  $("login").style.display = "none"; $("app").style.display = "block";
  if (!r.store) { $("list").innerHTML = `<div class="setup"><b>One step left: connect the database.</b><ol><li>Vercel → project <b>pranav</b> → <b>Storage</b> → <b>Create</b> → <b>Upstash for Redis</b> (free plan).</li><li>Connect it to the <b>pranav</b> project (all environments).</li><li>Redeploy. New form entries will then show up here.</li></ol></div>`; return; }
  load();
}
async function load() {
  $("list").innerHTML = '<div class="empty">Loading…</div>';
  try { leads = (await call({ action: "list" })).leads; draw(); }
  catch (e) { $("list").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
function shown() {
  const q = $("q").value.trim().toLowerCase(), k = $("kind").value, h = $("hand").value;
  return leads.filter(l => (filter === "all" || state(l) === filter || (filter === "abandoned" && state(l) === "now"))
    && (!k || l.kind === k) && (!h || (h === "handled") === !!l.handled)
    && (!q || JSON.stringify(l.fields).toLowerCase().includes(q)));
}
function draw() {
  $("cAll").textContent = leads.length;
  $("cSub").textContent = leads.filter(l => state(l) === "submitted").length;
  $("cAb").textContent = leads.filter(l => state(l) !== "submitted").length;
  const list = shown();
  if (!list.length) { $("list").innerHTML = '<div class="empty">Nothing here yet.</div>'; return; }
  $("list").innerHTML = list.map(l => {
    const f = l.fields || {}, st = state(l), phone = (f.phone || "").replace(/\D/g, "");
    const tag = st === "submitted" ? '<span class="tag sub">SUBMITTED</span>' : st === "now" ? '<span class="tag now">FILLING IN NOW</span>' : '<span class="tag ab">ABANDONED</span>';
    const kind = `<span class="tag kind">${l.kind === "booking" ? "Consultation booking" : "Contact form"}</span>`;
    const rows = Object.keys(LABELS).filter(k => f[k]).map(k => `<div><small>${LABELS[k]}</small>${esc(f[k])}</div>`).join("");
    const note = f.msg || f.notes;
    const hello = `Hi ${(f.name || "").split(" ")[0]}, this is Pranav Sheth. Thanks for reaching out through my website.`;
    return `<article class="lead${l.handled ? " handled" : ""}" data-id="${l.id}">
      <div class="top"><div>${tag}${kind}<h3 style="margin-top:8px">${esc(f.name || "No name yet")}</h3>
        <p class="when">${st === "submitted" ? "Sent " + fmt(l.submitted || l.updated) : "Last typed " + fmt(l.updated)}${l.emailed ? " · emailed to you" : ""}</p></div></div>
      <div class="grid">${rows}</div>
      ${note ? `<p class="note">${esc(note)}</p>` : ""}
      <div class="acts">
        ${phone.length >= 8 ? `<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${phone}?text=${encodeURIComponent(hello)}">WhatsApp</a>` : ""}
        ${f.email ? `<a class="btn" href="mailto:${esc(f.email)}?subject=${encodeURIComponent("Your enquiry — Pranav Sheth")}">Email</a>` : ""}
        <button class="btn red" type="button" data-del>Delete</button>
        <label><input type="checkbox" data-handled ${l.handled ? "checked" : ""}> Handled</label>
      </div></article>`;
  }).join("");
}
$("list").addEventListener("click", async e => {
  const card = e.target.closest(".lead"); if (!card) return;
  const id = card.dataset.id;
  if (e.target.matches("[data-del]")) {
    if (!confirm("Delete this lead for good?")) return;
    try { await call({ action: "delete", id }); leads = leads.filter(l => l.id !== id); draw(); } catch (err) { alert(err.message); }
  }
});
$("list").addEventListener("change", async e => {
  if (!e.target.matches("[data-handled]")) return;
  const id = e.target.closest(".lead").dataset.id, v = e.target.checked;
  try { await call({ action: "handled", id, handled: v }); const l = leads.find(x => x.id === id); if (l) l.handled = v; draw(); } catch (err) { alert(err.message); e.target.checked = !v; }
});
document.querySelectorAll(".stat").forEach(s => s.onclick = () => { filter = s.dataset.f; document.querySelectorAll(".stat").forEach(x => x.classList.toggle("on", x === s)); draw(); });
["q", "kind", "hand"].forEach(id => $(id).addEventListener("input", draw));
$("refresh").onclick = load;
$("out").onclick = () => { try { sessionStorage.removeItem("pranav-admin"); } catch (_) {} location.reload(); };
$("csv").onclick = () => {
  const cols = ["status", "form", "date", "name", "email", "phone", "city", "goal", "type", "budget", "timeline", "slotDubai", "topic", "how", "message", "handled"];
  const cell = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  const rows = shown().map(l => { const f = l.fields || {}; return [state(l) === "submitted" ? "submitted" : "abandoned", l.kind, new Date(l.submitted || l.updated).toISOString(), f.name, f.email, f.phone, f.city, f.goal, f.type, f.budget, f.timeline, f.slotDubai, f.topic, f.how, f.msg || f.notes, l.handled ? "yes" : "no"].map(cell).join(","); });
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + [cols.join(","), ...rows].join("\n")], { type: "text/csv" }));
  a.download = `pranav-leads-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
};
$("login").onsubmit = async e => { e.preventDefault(); $("lerr").textContent = ""; try { await login($("pw").value); } catch (err) { $("lerr").textContent = err.message; } };
if (PW) login(PW).catch(() => { try { sessionStorage.removeItem("pranav-admin"); } catch (_) {} });
</script>
</body>
</html>
