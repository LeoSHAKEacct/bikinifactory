<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel de sitios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120709; --panel:#1b0c10; --panel2:#241117; --line:rgba(244,160,176,.16); --line2:rgba(244,160,176,.28);
  --text:#fbecef; --muted:#c9a3ac; --rose:#ec5f7a; --rose2:#ffc4cf; --gold:#d9a86c; --ok:#25d366; --err:#ff6b6b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Jost,system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}

/* top bar */
.top{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:24px;color:var(--rose2);white-space:nowrap}
.brand small{font-family:Jost,sans-serif;font-style:normal;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-left:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:8px}
.tab:hover{border-color:var(--line2)}
.tab.on{background:var(--rose);border-color:var(--rose);color:#fff}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);display:none}
.tab.dirty .dot{display:inline-block}
.tab.add{border-style:dashed;color:var(--gold)}
.tab.add:hover{border-color:var(--gold)}
.spacer{flex:1}
.status{color:var(--muted);font-size:13px;white-space:nowrap}
.status.pending{color:var(--gold)}
.status.pending::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:8px;animation:blink 1s infinite}
.status.live{color:var(--ok)}
.status.live a{color:inherit}
.status.slow{color:var(--err)}
@keyframes blink{50%{opacity:.25}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid var(--line2);background:transparent;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{background:rgba(255,255,255,.05)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--ok);border-color:var(--ok);color:#05210f;font-weight:600}
.btn.primary:hover{background:#2ee672}
.btn.small{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--err);border-color:rgba(255,107,107,.35)}

/* layout */
.main{display:grid;grid-template-columns:minmax(360px,460px) 1fr;height:calc(100vh - 61px)}
.editor{overflow:auto;border-right:1px solid var(--line);padding:16px 16px 80px}
.preview{display:flex;flex-direction:column;min-width:0;background:#0c0507}
.pbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pbar .url{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:120px}
.seg{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{padding:7px 12px;background:transparent;border:0;cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--rose2)}
.frame-wrap{flex:1;display:flex;justify-content:center;overflow:auto;padding:16px}
.frame-wrap iframe{width:100%;height:100%;border:1px solid var(--line);border-radius:12px;background:#15070a;transition:width .25s}
.frame-wrap.mobile iframe{width:390px;flex:none}

/* editor */
.site-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.note{background:rgba(217,168,108,.08);border:1px solid rgba(217,168,108,.25);color:#f1d6b3;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px;line-height:1.5}
details.sec{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:10px}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:600;display:flex;align-items:center;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
details.sec[open]>summary::after{transform:rotate(-135deg)}
details.sec>summary .n{font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--gold);font-weight:500;font-size:18px}
.sec-body{padding:2px 16px 16px;display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:6px}
label.f>span{font-size:12px;letter-spacing:.06em;color:var(--muted)}
label.f>span em{font-style:normal;color:var(--gold);opacity:.85}
input[type=text],input[type=tel],textarea,select{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none;
}
textarea{resize:vertical;min-height:70px;line-height:1.5}
input:focus,textarea:focus,select:focus{border-color:var(--rose)}
.img-field{display:flex;gap:12px;align-items:center}
.thumb{width:84px;height:84px;border-radius:10px;border:1px dashed var(--line2);background:var(--panel2) center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center}
.thumb.has{border-style:solid}
.img-btns{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.img-btns input{display:none}
.list-item{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:rgba(255,255,255,.015)}
.list-head{display:flex;align-items:center;gap:6px}
.list-head b{font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--gold);font-size:17px;font-weight:500;margin-right:auto}
.icon-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--muted)}
.icon-btn:hover{color:var(--text);border-color:var(--line2)}
.sub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:6px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.card h3{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:500}
.card p{color:var(--muted);line-height:1.5}
.card .err{color:var(--err);font-size:13px;min-height:1em}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:12px 18px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:calc(100vw - 32px);line-height:1.5}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast.ok{border-color:rgba(37,211,102,.5)}
.toast.err{border-color:rgba(255,107,107,.5)}

/* mobile */
.mtabs{display:none}
@media (max-width:900px){
  .main{grid-template-columns:1fr;height:auto}
  .editor{border-right:0}
  .preview{display:none;height:calc(100vh - 110px)}
  body.show-preview .editor{display:none}
  body.show-preview .preview{display:flex}
  .mtabs{display:flex;gap:6px;padding:8px 16px;border-bottom:1px solid var(--line)}
  .mtabs .btn{flex:1}
  .mtabs .btn.on{background:var(--panel2);color:var(--rose2)}
  .seg{display:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">Sitios <small>Admin</small></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="spacer"></div>
  <span class="status" id="status"></span>
  <button class="btn primary" id="publish">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    Publicar en Vercel
  </button>
</header>
<div class="mtabs"><button class="btn on" data-view="edit">Editar</button><button class="btn" data-view="preview">Vista previa</button></div>

<div class="main">
  <section class="editor" id="editor"></section>
  <section class="preview">
    <div class="pbar">
      <span class="url" id="url"></span>
      <div class="seg" id="device"><button class="on" data-d="desktop">Escritorio</button><button data-d="mobile">Celular</button></div>
      <a class="btn small" id="live" target="_blank" rel="noopener">Ver en vivo ↗</a>
    </div>
    <div class="frame-wrap" id="frameWrap"><iframe id="frame" src="/_site/preview.html" title="Vista previa"></iframe></div>
  </section>
</div>

<div class="modal" id="pwModal">
  <form class="card" id="pwForm">
    <h3>Contraseña</h3>
    <p>Escribe la contraseña del panel para publicar.</p>
    <input type="text" id="pwInput" autocomplete="current-password" style="-webkit-text-security:disc" placeholder="Contraseña">
    <div class="err" id="pwErr"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button type="button" class="btn" id="pwCancel">Cancelar</button>
      <button type="submit" class="btn primary">Entrar</button>
    </div>
  </form>
</div>
<div class="modal" id="nsModal">
  <form class="card" id="nsForm">
    <h3>Nuevo sitio</h3>
    <p>Se crea una copia que puedes editar. Queda en vivo cuando pulses <b>Publicar en Vercel</b>.</p>
    <label class="f"><span>Dirección</span>
      <div style="display:flex;align-items:center;gap:6px"><span id="nsHost" style="color:var(--muted);font-size:13px;white-space:nowrap"></span><input type="text" id="nsSlug" placeholder="d" autocomplete="off"></div>
    </label>
    <label class="f"><span>Nombre de la pestaña <em>· solo se ve en el panel</em></span><input type="text" id="nsLabel" placeholder="Sitio D" maxlength="40"></label>
    <label class="f"><span>Copiar textos de</span><select id="nsSrc"></select></label>
    <label style="display:flex;gap:8px;align-items:center;color:var(--muted)"><input type="checkbox" id="nsPhotos"> Copiar también las fotos</label>
    <div class="err" id="nsErr"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button type="button" class="btn" id="nsCancel">Cancelar</button>
      <button type="submit" class="btn primary">Crear sitio</button>
    </div>
  </form>
</div>
<div class="toast" id="toast"></div>

<script>
// Loaded from /sites.json at startup; new sites are added from the panel.
var SITES = [{ slug: 'alana', label: 'Alana' }];
var RESERVED = ['admin', 'api', '_site', 'anamaria', 'mohammad', 'index', 'sites', 'public', 'static'];
var ICONS = [['home','Casa'],['parking','Parqueadero'],['shield','Discreción'],['drink','Bebida'],['heart','Corazón'],['star','Estrella'],['candle','Vela'],['car','Carro / domicilio']];

// Form layout: [path, label, type, hint]
var FORM = [
  { title: 'General', open: true, fields: [
    ['name', 'Nombre (logo y foto)'],
    ['phone', 'WhatsApp con código de país', 'tel', 'Ej: 573217455367'],
    ['waMessage', 'Mensaje que llega por WhatsApp'],
    ['seo.title', 'Título en la pestaña y en Google'],
    ['seo.description', 'Descripción para Google y al compartir el link', 'textarea'],
    ['nav.services', 'Menú: masajes'], ['nav.facilities', 'Menú: instalaciones'], ['nav.zones', 'Menú: zonas'], ['nav.reserve', 'Botón del menú'],
    ['footer', 'Pie de página']
  ]},
  { title: 'Portada', open: true, fields: [
    ['hero.photo', 'Foto principal', 'image'],
    ['hero.eyebrow', 'Texto pequeño arriba (dorado)'],
    ['hero.title', 'Título'],
    ['hero.titleAccent', 'Título, parte en color'],
    ['hero.greeting', 'Saludo'],
    ['hero.lead', 'Frase', 'textarea'],
    ['hero.ctaPrimary', 'Botón de WhatsApp'],
    ['hero.ctaSecondary', 'Segundo botón (vacío = ocultar)'],
    ['hero.badgeTitle', 'Etiqueta sobre la foto: nombre'],
    ['hero.badgeText', 'Etiqueta sobre la foto: texto']
  ]},
  { title: 'Frase destacada', fields: [
    ['intro.quote', 'Frase'], ['intro.quoteAccent', 'Frase, parte en color'], ['intro.body', 'Texto', 'textarea']
  ]},
  { title: 'Masajes', fields: [
    ['services.eyebrow', 'Texto pequeño (dorado)'], ['services.title', 'Título'],
    { list: 'services.items', label: 'Masaje', add: '+ Agregar masaje', empty: { name: 'Nuevo masaje', desc: '' },
      fields: [['name', 'Nombre'], ['desc', 'Descripción', 'textarea']] },
    ['services.benefit', 'Frase de beneficios (vacío = ocultar)', 'textarea']
  ]},
  { title: 'Instalaciones', fields: [
    ['facilities.eyebrow', 'Texto pequeño (dorado)'], ['facilities.title', 'Título'],
    { list: 'facilities.items', label: 'Comodidad', add: '+ Agregar comodidad', empty: { icon: 'star', title: 'Nueva', desc: '' },
      fields: [['icon', 'Ícono', 'icon'], ['title', 'Título'], ['desc', 'Descripción']] },
    { list: 'facilities.gallery', label: 'Foto', fixed: true, sub: 'Galería (la primera es la grande)',
      fields: [['photo', 'Foto', 'image'], ['caption', 'Texto sobre la foto'], ['placeholder', 'Texto si no hay foto']] }
  ]},
  { title: 'Domicilios', fields: [
    ['zones.eyebrow', 'Texto pequeño (dorado)'], ['zones.title', 'Título'], ['zones.text', 'Texto', 'textarea'],
    ['zones.places', 'Lugares (uno por línea)', 'lines']
  ]},
  { title: 'Reserva (final)', fields: [
    ['cta.eyebrow', 'Texto pequeño (dorado)'], ['cta.title', 'Título'], ['cta.text', 'Texto', 'textarea'],
    ['cta.button', 'Botón', 'text', '{telefono} se cambia por el número']
  ]}
];

var state = { slug: 'alana', published: {}, drafts: {}, password: '', isNew: {} };
try { state.password = sessionStorage.getItem('adminpw') || ''; } catch (e) {}

var $ = function (id) { return document.getElementById(id); };
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function get(o, path) { return path.split('.').reduce(function (a, k) { return a == null ? a : a[k]; }, o); }
function set(o, path, v) {
  var ks = path.split('.'), last = ks.pop();
  ks.forEach(function (k) { if (o[k] == null) o[k] = {}; o = o[k]; });
  o[last] = v;
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var localImages = {};
function photoUrl(v, slug) {
  if (!v) return '';
  if (/^(data:|https?:|\/)/.test(v)) return localImages[v] || v;
  return localImages['/' + slug + '/' + v] || '/' + slug + '/' + v;
}
function siteLabel(slug) { var s = SITES.filter(function (x) { return x.slug === slug; })[0]; return s ? s.label : slug; }
function draft() { return state.drafts[state.slug]; }
function isDirty(slug) {
  if (state.isNew[slug]) return true;
  return state.drafts[slug] && state.published[slug] && JSON.stringify(state.drafts[slug]) !== JSON.stringify(state.published[slug]);
}

var toastTimer;
function toast(html, kind, ms) {
  var t = $('toast');
  t.innerHTML = html; t.className = 'toast on ' + (kind || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.className = 'toast'; }, ms || 4000);
}

// ---------- persistence of drafts in this browser ----------
var warnedQuota = false;
function saveDraft(slug) {
  try {
    if (isDirty(slug)) localStorage.setItem('draft:' + slug, JSON.stringify(state.drafts[slug]));
    else localStorage.removeItem('draft:' + slug);
  } catch (e) {
    if (!warnedQuota) { warnedQuota = true; toast('Borrador muy grande para guardarlo en el navegador (por las fotos). Publica para no perder los cambios.', 'err', 7000); }
  }
}
function loadDraft(slug) {
  try { var s = localStorage.getItem('draft:' + slug); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}

async function loadSite(slug) {
  if (state.published[slug] || state.isNew[slug]) return;
  var r = await fetch('/' + slug + '/content.json?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('No se pudo cargar /' + slug + '/content.json');
  state.published[slug] = await r.json();
  state.drafts[slug] = loadDraft(slug) || clone(state.published[slug]);
}

// ---------- tabs ----------
function renderTabs() {
  $('tabs').innerHTML = SITES.map(function (s) {
    return '<button class="tab' + (s.slug === state.slug ? ' on' : '') + (isDirty(s.slug) ? ' dirty' : '') + '" data-slug="' + s.slug + '"><span class="dot"></span>' + s.label + '</button>';
  }).join('') + '<button class="tab add" id="addSite">+ Nuevo sitio</button>';
  var dirty = isDirty(state.slug), dep = deploys[state.slug], st = $('status');
  st.className = 'status';
  if (state.isNew[state.slug]) st.textContent = 'Sitio nuevo, sin publicar';
  else if (dirty) st.textContent = 'Cambios sin publicar';
  else if (dep && dep.state === 'pending') { st.textContent = 'Publicando en Vercel…'; st.className = 'status pending'; }
  else if (dep && dep.state === 'live') { st.innerHTML = '✓ En vivo · <a href="/' + state.slug + '/" target="_blank" rel="noopener">ver sitio</a>'; st.className = 'status live'; }
  else if (dep && dep.state === 'slow') { st.textContent = 'Vercel está tardando, revisa en unos minutos'; st.className = 'status slow'; }
  else st.textContent = 'Todo publicado';
  $('publish').disabled = !dirty;
}

// After publishing, poll the live site until it serves the new content.
var deploys = {};
function watchDeploy(slug, content) {
  var want = JSON.stringify(content), started = Date.now();
  var dep = deploys[slug] = { state: 'pending' };
  renderTabs();
  (function check() {
    if (deploys[slug] !== dep) return;
    fetch('/' + slug + '/content.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (live) {
        if (deploys[slug] !== dep) return;
        if (live && JSON.stringify(live) === want) {
          dep.state = 'live'; renderTabs();
          toast('✓ <b>' + esc(siteLabel(slug)) + '</b> ya está en vivo: <a href="/' + slug + '/" target="_blank" rel="noopener"><b>' + esc(location.host) + '/' + slug + '/</b></a>', 'ok', 9000);
        } else if (Date.now() - started > 4 * 60 * 1000) {
          dep.state = 'slow'; renderTabs();
        } else {
          setTimeout(check, 5000);
        }
      });
  })();
}
$('tabs').addEventListener('click', function (e) {
  var b = e.target.closest('.tab'); if (!b) return;
  if (b.id === 'addSite') { openNewSite(); return; }
  switchSite(b.dataset.slug);
});

async function switchSite(slug) {
  state.slug = slug;
  try { await loadSite(slug); } catch (e) { toast(esc(e.message), 'err'); return; }
  var path = '/' + slug + '/';
  $('url').textContent = location.host + path;
  $('live').href = path;
  renderTabs(); renderEditor(); pushPreview();
}

// ---------- editor ----------
function fieldHtml(path, label, type, hint, value) {
  var lab = '<span>' + esc(label) + (hint ? ' <em>· ' + esc(hint) + '</em>' : '') + '</span>';
  if (type === 'image') {
    var url = photoUrl(value, state.slug);
    return '<div class="f"><label class="f" style="gap:6px"><span>' + esc(label) + '</span></label><div class="img-field">' +
      '<div class="thumb' + (url ? ' has' : '') + '" style="' + (url ? 'background-image:url(&quot;' + esc(url) + '&quot;)' : '') + '">' + (url ? '' : 'Sin foto') + '</div>' +
      '<div class="img-btns"><label class="btn small">' + (url ? 'Cambiar foto' : 'Subir foto') +
      '<input type="file" accept="image/*" data-img="' + esc(path) + '"></label>' +
      (url ? '<button type="button" class="btn small danger" data-clear="' + esc(path) + '">Quitar</button>' : '') + '</div></div></div>';
  }
  if (type === 'textarea') return '<label class="f">' + lab + '<textarea data-path="' + esc(path) + '">' + esc(value) + '</textarea></label>';
  if (type === 'lines') return '<label class="f">' + lab + '<textarea data-path="' + esc(path) + '" data-lines="1">' + esc((value || []).join('\n')) + '</textarea></label>';
  if (type === 'icon') {
    return '<label class="f">' + lab + '<select data-path="' + esc(path) + '">' + ICONS.map(function (i) {
      return '<option value="' + i[0] + '"' + (i[0] === value ? ' selected' : '') + '>' + i[1] + '</option>';
    }).join('') + '</select></label>';
  }
  return '<label class="f">' + lab + '<input type="' + (type === 'tel' ? 'tel' : 'text') + '" data-path="' + esc(path) + '" value="' + esc(value) + '"></label>';
}

function renderEditor() {
  var d = draft();
  var openState = {};
  document.querySelectorAll('details.sec').forEach(function (el, i) { openState[i] = el.open; });
  var html = '<div class="site-actions">';
  if (state.slug !== 'alana') html += '<button class="btn small" id="copyAlana">Copiar textos de Alana</button>';
  html += '<button class="btn small danger" id="discard"' + (isDirty(state.slug) ? '' : ' disabled') + '>Descartar cambios</button></div>';
  html += '<div class="note" style="background:rgba(236,95,122,.07);border-color:var(--line2);color:var(--rose2)">Tip: escribe <b>{nombre}</b> o <b>{telefono}</b> en cualquier texto y se reemplaza solo.</div>';
  html += '<div class="note">Editando <b>' + esc(siteLabel(state.slug)) + '</b> · link: <b>' + esc(location.host) + '/' + state.slug + '/</b><br>Los cambios se ven al lado al instante. Con <b>Publicar en Vercel</b> quedan en vivo en ~1 minuto; arriba verás cuándo está listo.</div>';

  FORM.forEach(function (sec, si) {
    var open = si in openState ? openState[si] : sec.open;
    html += '<details class="sec"' + (open ? ' open' : '') + '><summary><span class="n">' + (si + 1) + '</span>' + esc(sec.title) + '</summary><div class="sec-body">';
    sec.fields.forEach(function (f) {
      if (Array.isArray(f)) { html += fieldHtml(f[0], f[1], f[2], f[3], get(d, f[0])); return; }
      var items = get(d, f.list) || [];
      if (f.sub) html += '<div class="sub">' + esc(f.sub) + '</div>';
      items.forEach(function (it, i) {
        html += '<div class="list-item"><div class="list-head"><b>' + esc(f.label) + ' ' + (i + 1) + '</b>';
        if (!f.fixed) {
          html += '<button type="button" class="icon-btn" title="Subir" data-move="' + f.list + '|' + i + '|-1">↑</button>' +
            '<button type="button" class="icon-btn" title="Bajar" data-move="' + f.list + '|' + i + '|1">↓</button>' +
            '<button type="button" class="icon-btn" title="Eliminar" data-del="' + f.list + '|' + i + '">✕</button>';
        }
        html += '</div>';
        f.fields.forEach(function (sf) { html += fieldHtml(f.list + '.' + i + '.' + sf[0], sf[1], sf[2], sf[3], it[sf[0]]); });
        html += '</div>';
      });
      if (!f.fixed) html += '<button type="button" class="btn small" data-add="' + f.list + '">' + esc(f.add) + '</button>';
    });
    html += '</div></details>';
  });
  var ed = $('editor'), top = ed.scrollTop;
  ed.innerHTML = html;
  ed.scrollTop = top;
}

function changed(rerender) {
  saveDraft(state.slug);
  renderTabs();
  if (rerender) renderEditor();
  else { var b = $('discard'); if (b) b.disabled = !isDirty(state.slug); }
  schedulePreview();
}

$('editor').addEventListener('input', function (e) {
  var el = e.target, path = el.dataset.path; if (!path) return;
  var v = el.value;
  if (el.dataset.lines) v = v.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
  if (path === 'phone') v = v.replace(/[^\d+ ]/g, '');
  set(draft(), path, v);
  changed(false);
});

$('editor').addEventListener('click', function (e) {
  var t = e.target, d = draft(), p;
  if (t.dataset.add) {
    var f = findList(t.dataset.add);
    (get(d, t.dataset.add) || set(d, t.dataset.add, []) || get(d, t.dataset.add)).push(clone(f.empty));
    changed(true);
  } else if (t.dataset.del) {
    p = t.dataset.del.split('|');
    if (!confirm('¿Eliminar este elemento?')) return;
    get(d, p[0]).splice(+p[1], 1); changed(true);
  } else if (t.dataset.move) {
    p = t.dataset.move.split('|');
    var arr = get(d, p[0]), i = +p[1], j = i + (+p[2]);
    if (j < 0 || j >= arr.length) return;
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp; changed(true);
  } else if (t.dataset.clear) {
    set(d, t.dataset.clear, ''); changed(true);
  } else if (t.id === 'discard') {
    if (!confirm('¿Descartar todos los cambios sin publicar de ' + siteLabel(state.slug) + '?')) return;
    state.drafts[state.slug] = clone(state.published[state.slug]); changed(true);
  } else if (t.id === 'copyAlana') {
    copyFromAlana();
  }
});

function findList(path) {
  var out;
  FORM.forEach(function (s) { s.fields.forEach(function (f) { if (f.list === path) out = f; }); });
  return out;
}

async function copyFromAlana() {
  if (!confirm('¿Copiar todos los textos y el teléfono de Alana a ' + siteLabel(state.slug) + '? Las fotos de este sitio se mantienen.')) return;
  await loadSite('alana');
  var src = clone(state.drafts.alana), d = draft();
  src.hero.photo = d.hero && d.hero.photo || '';
  var gal = (d.facilities && d.facilities.gallery) || [];
  (src.facilities.gallery || []).forEach(function (g, i) { g.photo = gal[i] ? gal[i].photo : ''; g.caption = gal[i] ? gal[i].caption : ''; });
  state.drafts[state.slug] = src; changed(true);
}

// ---------- images ----------
$('editor').addEventListener('change', async function (e) {
  var el = e.target; if (!el.dataset.img || !el.files[0]) return;
  try {
    var url = await resizeImage(el.files[0], 1600, 0.85);
    set(draft(), el.dataset.img, url);
    changed(true);
  } catch (err) { toast('No se pudo leer la imagen.', 'err'); }
});

function resizeImage(file, max, quality) {
  return new Promise(function (resolve, reject) {
    var img = new Image(), src = URL.createObjectURL(file);
    img.onload = function () {
      var s = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(src);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = function () { URL.revokeObjectURL(src); reject(new Error('bad image')); };
    img.src = src;
  });
}

// ---------- preview ----------
var frameReady = false, previewTimer;
addEventListener('message', function (e) {
  if (e.origin === location.origin && e.data && e.data.type === 'preview-ready') { frameReady = true; pushPreview(); }
});
$('frame').addEventListener('load', function () { frameReady = true; pushPreview(); });
// The preview may already have loaded (from cache) before this script ran.
try { if ($('frame').contentWindow.renderSite) frameReady = true; } catch (e) {}
function pushPreview() {
  if (!frameReady || !draft()) return;
  var c = clone(draft());
  if (c.hero) c.hero.photo = photoUrl(c.hero.photo, state.slug);
  ((c.facilities || {}).gallery || []).forEach(function (g) { g.photo = photoUrl(g.photo, state.slug); });
  $('frame').contentWindow.postMessage({ type: 'preview', slug: state.slug, content: c }, location.origin);
}
function schedulePreview() { clearTimeout(previewTimer); previewTimer = setTimeout(pushPreview, 120); }

$('device').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  [].forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
  $('frameWrap').classList.toggle('mobile', b.dataset.d === 'mobile');
});
document.querySelector('.mtabs').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  [].forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
  document.body.classList.toggle('show-preview', b.dataset.view === 'preview');
  if (b.dataset.view === 'preview') pushPreview();
});

// ---------- password ----------
function askPassword() {
  return new Promise(function (resolve) {
    $('pwErr').textContent = ''; $('pwInput').value = '';
    $('pwModal').classList.add('on'); $('pwInput').focus();
    $('pwCancel').onclick = function () { $('pwModal').classList.remove('on'); resolve(false); };
    $('pwForm').onsubmit = async function (e) {
      e.preventDefault();
      var pw = $('pwInput').value;
      try {
        var r = await fetch('/api/login', { method: 'POST', headers: { 'x-admin-password': pw } });
        var j = await r.json().catch(function () { return {}; });
        if (!r.ok) { $('pwErr').textContent = j.error || ('Error ' + r.status); return; }
        state.password = pw;
        try { sessionStorage.setItem('adminpw', pw); } catch (err) {}
        $('pwModal').classList.remove('on'); resolve(true);
      } catch (err) { $('pwErr').textContent = 'Sin conexión con el servidor.'; }
    };
  });
}

// ---------- publish ----------
$('publish').addEventListener('click', async function () {
  if (!state.password && !(await askPassword())) return;
  var slug = state.slug, content = clone(draft()), images = {}, stamp = Date.now().toString(36), n = 0;
  function take(obj, key, tag) {
    var v = obj[key];
    if (typeof v === 'string' && v.indexOf('data:image') === 0) {
      var name = tag + '-' + stamp + (n++ ? '-' + n : '') + '.jpg';
      images[name] = v; obj[key] = name;
    }
  }
  take(content.hero, 'photo', 'foto');
  (content.facilities.gallery || []).forEach(function (g, i) { take(g, 'photo', 'galeria' + (i + 1)); });
  var size = JSON.stringify(images).length;
  if (size > 4 * 1024 * 1024) { toast('Demasiadas fotos nuevas a la vez. Publica de a una o dos fotos.', 'err', 6000); return; }

  var btn = $('publish'); btn.disabled = true; btn.lastChild.textContent = ' Publicando…';
  try {
    var r = await fetch('/api/publish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': state.password },
      body: JSON.stringify({ slug: slug, content: content, images: images, create: state.isNew[slug] ? { label: siteLabel(slug) } : undefined })
    });
    var j = await r.json().catch(function () { return {}; });
    if (r.status === 401) {
      state.password = ''; try { sessionStorage.removeItem('adminpw'); } catch (e) {}
      toast('Contraseña incorrecta. Intenta de nuevo.', 'err');
      return;
    }
    if (!r.ok) throw new Error(j.error || ('Error ' + r.status));
    // Show new photos from memory until Vercel finishes deploying them.
    Object.keys(images).forEach(function (name) { localImages['/' + slug + '/' + name] = images[name]; });
    state.published[slug] = content;
    state.drafts[slug] = clone(content);
    delete state.isNew[slug]; saveNewSites();
    saveDraft(slug);
    renderTabs(); renderEditor(); pushPreview();
    toast('¡Guardado! Vercel está publicando <b>' + esc(siteLabel(slug)) + '</b>, toma ~1 minuto. Te aviso aquí cuando esté en vivo.', 'ok', 7000);
    watchDeploy(slug, content);
  } catch (e) {
    toast('No se pudo publicar: ' + esc(e.message), 'err', 8000);
  } finally {
    btn.lastChild.textContent = ' Publicar en Vercel';
    renderTabs();
  }
});
addEventListener('beforeunload', function (e) {
  if (SITES.some(function (s) { return isDirty(s.slug); })) { e.preventDefault(); e.returnValue = ''; }
});

// ---------- new sites ----------
function saveNewSites() {
  try { localStorage.setItem('newsites', JSON.stringify(state.isNew)); } catch (e) {}
}
function openNewSite() {
  $('nsSlug').value = ''; $('nsLabel').value = ''; $('nsErr').textContent = ''; $('nsPhotos').checked = false;
  $('nsSrc').innerHTML = SITES.filter(function (s) { return !state.isNew[s.slug]; }).map(function (s) {
    return '<option value="' + esc(s.slug) + '"' + (s.slug === state.slug ? ' selected' : '') + '>' + esc(s.label) + ' (/' + esc(s.slug) + '/)</option>';
  }).join('');
  $('nsHost').textContent = location.host + '/';
  $('nsModal').classList.add('on'); $('nsSlug').focus();
}
$('nsCancel').onclick = function () { $('nsModal').classList.remove('on'); };
$('nsSlug').addEventListener('input', function () {
  $('nsErr').textContent = '';
  this.value = this.value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9-]/g, '-').replace(/^-+/, '').slice(0, 30);
});
$('nsForm').onsubmit = async function (e) {
  e.preventDefault();
  var slug = $('nsSlug').value.replace(/-+$/, ''), label = $('nsLabel').value.trim(), src = $('nsSrc').value;
  var err = function (m) { $('nsErr').textContent = m; };
  if (!slug) return err('Escribe la dirección, por ejemplo: d');
  if (RESERVED.indexOf(slug) >= 0) return err('Esa dirección está reservada, elige otra.');
  if (SITES.some(function (s) { return s.slug === slug; })) return err('Ya existe un sitio en /' + slug + '/.');
  if (!label) label = 'Sitio ' + slug.toUpperCase();
  try { await loadSite(src); } catch (x) { return err(x.message); }
  var c = clone(state.drafts[src]);
  var photo = function (v) {
    if (!$('nsPhotos').checked || !v) return '';
    return /^(data:|https?:|\/)/.test(v) ? v : '/' + src + '/' + v;
  };
  c.hero.photo = photo(c.hero.photo);
  ((c.facilities || {}).gallery || []).forEach(function (g) { g.photo = photo(g.photo); if (!g.photo) g.caption = ''; });
  SITES.push({ slug: slug, label: label });
  state.isNew[slug] = { label: label }; saveNewSites();
  state.drafts[slug] = c;
  saveDraft(slug);
  $('nsModal').classList.remove('on');
  await switchSite(slug);
  toast('Sitio <b>' + esc(label) + '</b> creado como borrador. Edítalo y pulsa <b>Publicar en Vercel</b> para ponerlo en vivo.', 'ok', 8000);
};

(async function start() {
  try {
    var r = await fetch('/sites.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) SITES = await r.json();
  } catch (e) {}
  // Restore sites created here but not yet published (or still deploying).
  try {
    var pending = JSON.parse(localStorage.getItem('newsites') || '{}');
    Object.keys(pending).forEach(function (slug) {
      if (SITES.some(function (s) { return s.slug === slug; })) return;
      var d = loadDraft(slug); if (!d) return;
      SITES.push({ slug: slug, label: pending[slug].label });
      state.isNew[slug] = pending[slug]; state.drafts[slug] = d;
    });
  } catch (e) {}
  switchSite(SITES[0].slug);
})();
</script>
