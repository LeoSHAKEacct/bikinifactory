<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sitios de la clase</title>
<meta name="description" content="Todos los negocios y páginas creados por los estudiantes.">
<meta name="theme-color" content="#120709">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120709; --bg2:#1b0c10; --panel:rgba(255,220,226,.045); --line:rgba(244,160,176,.16); --line2:rgba(244,160,176,.3);
  --text:#fbecef; --muted:#c9a3ac; --rose:#ec5f7a; --rose2:#ffc4cf; --gold:#d9a86c; --wa:#25d366;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Jost,system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:0;z-index:10;background:rgba(18,7,9,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:14px;height:62px}
.brand{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:24px;color:var(--rose2)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:999px;border:1px solid var(--line2);font-weight:500;font-size:14px;cursor:pointer;background:transparent;color:inherit;white-space:nowrap;transition:background .2s,border-color .2s}
.btn:hover{border-color:var(--gold);background:var(--panel)}
.btn.primary{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.primary:hover{background:#f2738b}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#05210f}
.btn svg{width:16px;height:16px}
.hero{padding:70px 0 34px;text-align:center;background:radial-gradient(ellipse 60% 80% at 50% 0%,rgba(236,95,122,.18),transparent 70%)}
.eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(40px,7vw,72px);line-height:1.05;margin:14px 0 12px}
.sub{color:var(--muted);font-size:18px;max-width:36em;margin:0 auto}
.tools{display:flex;flex-direction:column;gap:14px;align-items:center;margin:34px auto 0;max-width:720px}
.search{width:100%;display:flex;align-items:center;gap:10px;padding:0 18px;border:1px solid var(--line2);border-radius:999px;background:var(--panel)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;background:transparent;border:0;outline:none;color:var(--text);font:inherit;font-size:16px;padding:14px 0}
.cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cats button{padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:13.5px;cursor:pointer}
.cats button.on{border-color:var(--rose);color:var(--rose2);background:rgba(236,95,122,.12)}
.count{color:var(--muted);font-size:14px;margin:30px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;padding-bottom:80px}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--bg2);transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 24px 50px -24px rgba(0,0,0,.8)}
.pic{position:relative;aspect-ratio:4/3;background:linear-gradient(160deg,rgba(236,95,122,.18),rgba(195,22,63,.06) 60%,transparent),#1d0e12;display:flex;align-items:center;justify-content:center}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pic .initial{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:64px;color:var(--rose2);opacity:.6}
.pic .cat{position:absolute;left:12px;top:12px;padding:5px 12px;border-radius:999px;background:rgba(18,7,9,.78);backdrop-filter:blur(6px);font-size:12px;letter-spacing:.06em;color:var(--rose2);border:1px solid var(--line)}
.body{display:flex;flex-direction:column;gap:8px;padding:18px 18px 16px;flex:1}
.body h2{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:27px;line-height:1.1}
.desc{color:var(--muted);font-size:14.5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:13px;color:var(--gold);display:flex;flex-wrap:wrap;gap:4px 12px}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:10px}
.actions .btn{flex:1;padding:9px 12px;font-size:13.5px}
.empty{text-align:center;color:var(--muted);padding:60px 0}
footer{border-top:1px solid var(--line);padding:26px 0;text-align:center;color:var(--muted);font-size:13px}
@media (max-width:560px){header.top .btn.ghost{display:none}.hero{padding-top:44px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="/feed/">Sitios</a>
  <div class="spacer"></div>
  <a class="btn ghost" href="/admin/">Entrar</a>
  <a class="btn primary" href="/admin/">Crear mi sitio</a>
</div></header>

<section class="hero"><div class="wrap">
  <div class="eyebrow">Directorio</div>
  <h1 id="title">Sitios de la clase</h1>
  <p class="sub" id="subtitle"></p>
  <div class="tools">
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar por nombre, tipo de negocio o ciudad…" aria-label="Buscar"></label>
    <div class="cats" id="cats"></div>
  </div>
</div></section>

<main class="wrap">
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
</main>
<footer>Páginas creadas con el panel de sitios · <a href="/admin/" style="color:var(--gold)">Crear la mía</a></footer>

<script>
(function () {
  var data = { sites: [] }, cat = '', q = '';
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var norm = function (s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); };
  var WA = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.05 2C6.53 2 2.05 6.47 2.05 12c0 1.77.46 3.5 1.34 5.02L2 22l5.12-1.34A9.95 9.95 0 0 0 12.05 22c5.52 0 10-4.48 10-10s-4.48-10-10-10zm5.47 14.13c-.23.65-1.36 1.25-1.87 1.29-.5.05-.98.23-3.3-.69-2.79-1.1-4.55-3.95-4.69-4.13-.13-.18-1.12-1.49-1.12-2.85 0-1.35.71-2.02.96-2.29.25-.28.55-.35.73-.35l.53.01c.17 0 .4-.06.62.48.23.55.78 1.9.85 2.04.07.14.11.3.02.48-.09.18-.14.3-.27.46-.14.16-.29.36-.41.48-.14.14-.28.29-.12.56.16.28.71 1.17 1.52 1.9 1.05.93 1.93 1.22 2.2 1.36.28.14.44.12.6-.07.16-.18.69-.81.88-1.09.18-.28.37-.23.62-.14.25.09 1.6.76 1.87.9.28.14.46.2.53.32.07.12.07.67-.16 1.32z"/></svg>';

  function render() {
    var nq = norm(q);
    var list = data.sites.filter(function (s) {
      if (cat && norm(s.category) !== norm(cat)) return false;
      if (!nq) return true;
      return norm([s.name, s.category, s.description, (s.places || []).join(' '), s.owner].join(' ')).indexOf(nq) >= 0;
    });
    document.getElementById('count').textContent = list.length + (list.length === 1 ? ' sitio' : ' sitios');
    document.getElementById('grid').innerHTML = list.length ? list.map(function (s) {
      var pic = s.photo ? '<img src="' + esc(s.photo) + '" alt="" loading="lazy">' : '<span class="initial">' + esc((s.name || '?').charAt(0)) + '</span>';
      var meta = [];
      if ((s.places || []).length) meta.push('📍 ' + esc(s.places.join(', ')));
      if (s.owner) meta.push('por ' + esc(s.owner));
      return '<article class="card"><a class="pic" href="/' + esc(s.slug) + '/">' + pic + (s.category ? '<span class="cat">' + esc(s.category) + '</span>' : '') + '</a>' +
        '<div class="body"><h2>' + esc(s.name || s.slug) + '</h2>' + (s.description ? '<p class="desc">' + esc(s.description) + '</p>' : '') +
        (meta.length ? '<div class="meta">' + meta.map(function (m) { return '<span>' + m + '</span>'; }).join('') + '</div>' : '') +
        '<div class="actions"><a class="btn primary" href="/' + esc(s.slug) + '/">Ver sitio</a>' +
        (s.phone ? '<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/' + esc(s.phone) + '?text=' + encodeURIComponent('Hola ' + (s.name || '') + ', vi tu página') + '">' + WA + 'WhatsApp</a>' : '') +
        '</div></div></article>';
    }).join('') : '<p class="empty">No hay sitios que coincidan.</p>';
  }

  function renderCats() {
    var seen = {}, cats = [];
    data.sites.forEach(function (s) { var c = (s.category || '').trim(); if (c && !seen[norm(c)]) { seen[norm(c)] = 1; cats.push(c); } });
    var el = document.getElementById('cats');
    el.innerHTML = cats.length ? ['<button type="button" data-c="" class="on">Todos</button>'].concat(cats.sort().map(function (c) {
      return '<button type="button" data-c="' + esc(c) + '">' + esc(c) + '</button>';
    })).join('') : '';
    el.onclick = function (e) {
      var b = e.target.closest('button'); if (!b) return;
      cat = b.dataset.c;
      [].forEach.call(el.children, function (x) { x.classList.toggle('on', x === b); });
      render();
    };
  }

  document.getElementById('q').addEventListener('input', function () { q = this.value; render(); });
  fetch('/feed.json?t=' + Math.floor(Date.now() / 60000), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      data = j; data.sites = data.sites || [];
      if (j.title) { document.getElementById('title').textContent = j.title; document.title = j.title; }
      document.getElementById('subtitle').textContent = j.subtitle || '';
      renderCats(); render();
    })
    .catch(function () { document.getElementById('grid').innerHTML = '<p class="empty">No se pudo cargar el directorio.</p>'; });
})();
</script>
</body>
</html>
