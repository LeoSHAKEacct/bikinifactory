<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda · Delírio Spa</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#110b0c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23110b0c'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='40' fill='%23d0ab72'%3ED%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body { background: var(--bg); }
  .top { border-bottom: 1px solid var(--line); background: var(--bg2); position: sticky; top: 0; z-index: 20; }
  .top .wrap { display: flex; align-items: center; gap: 16px; height: 68px; }
  .top .chip-demo { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--rose); border: 1px dashed rgba(217,144,138,.5); padding: 3px 10px; border-radius: 999px; }
  .top .sp { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .head { display: flex; justify-content: space-between; align-items: end; gap: 20px; flex-wrap: wrap; margin: 36px 0 24px; }
  .head h1 { font-size: clamp(36px, 5vw, 52px); }
  .head .date { font-size: 18px; color: var(--muted); text-transform: capitalize; margin-top: 6px; }
  .dnav { display: flex; gap: 8px; align-items: center; }
  .dnav input { background: var(--surface); border: 1px solid var(--line2); border-radius: 999px; height: 40px; padding: 0 14px; color-scheme: dark; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
  .kpi { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 18px 20px; }
  .kpi span { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .kpi b { display: block; font-family: var(--serif); font-size: 40px; font-weight: 500; line-height: 1.1; margin-top: 4px; }
  .kpi .bar { height: 4px; border-radius: 4px; background: var(--surface2); margin-top: 10px; overflow: hidden; }
  .kpi .bar i { display: block; height: 100%; background: var(--gold); }
  @media (max-width: 760px) { .kpis { grid-template-columns: 1fr 1fr; } }
  .board { border: 1px solid var(--line); border-radius: 20px; background: var(--surface); overflow: auto; }
  .grid { display: grid; min-width: 720px; position: relative; }
  .colh { position: sticky; top: 0; z-index: 3; background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 12px; display: flex; gap: 10px; align-items: center; }
  .colh .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--serif); font-style: italic; font-size: 17px; background: linear-gradient(135deg, #5a2230, #2a1215); border: 1px solid var(--line2); color: var(--gold2); flex: none; }
  .colh b { display: block; font-size: 14px; }
  .colh small { color: var(--faint); font-size: 12px; }
  .times, .col { position: relative; }
  .times { border-right: 1px solid var(--line); }
  .times div { position: absolute; right: 10px; font-size: 12px; color: var(--faint); transform: translateY(-50%); }
  .col { border-right: 1px solid var(--line); background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px var(--hh)); }
  .col:last-child { border-right: 0; }
  .blk { position: absolute; left: 6px; right: 6px; border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.35; overflow: hidden; cursor: pointer; border-left: 3px solid var(--c); background: color-mix(in srgb, var(--c) 28%, var(--surface)); transition: transform .15s; }
  .blk:hover { transform: scale(1.015); z-index: 2; }
  .blk b { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk span { color: rgba(244,235,228,.7); }
  .blk.online { background: linear-gradient(135deg, rgba(233,205,155,.28), rgba(208,171,114,.12)); border-left-color: var(--gold2); box-shadow: 0 0 0 1px rgba(233,205,155,.45) inset; }
  .blk .on { display: inline-block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; background: var(--gold); color: #241515; border-radius: 4px; padding: 0 5px; margin-left: 4px; font-weight: 700; }
  .now { position: absolute; left: 0; right: 0; height: 2px; background: var(--rose); z-index: 2; pointer-events: none; }
  .now::before { content: ''; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--rose); }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 16px 0 0; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
  .closed { padding: 60px 20px; text-align: center; color: var(--faint); }
  .list { margin: 32px 0 80px; }
  .list h2 { font-size: 30px; margin-bottom: 14px; }
  .rowb { display: grid; grid-template-columns: 110px 1fr auto; gap: 16px; align-items: center; padding: 14px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); margin-bottom: 8px; font-size: 14px; }
  .rowb small { color: var(--faint); display: block; }
  .rowb .x { background: none; border: 0; color: var(--rose); cursor: pointer; text-decoration: underline; font-size: 13px; }
  .tip { position: fixed; z-index: 60; max-width: 280px; background: #2b1d1e; border: 1px solid var(--line2); border-radius: 14px; padding: 14px 16px; font-size: 13px; box-shadow: 0 20px 40px -10px rgba(0,0,0,.7); display: none; }
  .tip b { font-family: var(--serif); font-size: 20px; font-weight: 500; display: block; margin-bottom: 6px; }
  .tip div { color: var(--muted); }
  @media (max-width: 560px) { .rowb { grid-template-columns: 1fr auto; } .rowb > :first-child { grid-column: 1 / -1; } .top .ag-site { display: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a href="./" class="logo"><b>Delírio</b><span>Spa</span></a>
    <span class="chip-demo">Demo</span>
    <div class="sp">
      <div class="langs"><button data-lang="pt">PT</button><button data-lang="en">EN</button></div>
      <a href="./" class="btn btn-ghost btn-sm ag-site" data-i18n="ag.site">Ver site</a>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="head">
    <div><h1 data-i18n="ag.title">Agenda da equipa</h1><div class="date" id="dLabel"></div></div>
    <div class="dnav">
      <button class="icon-btn" id="prev" aria-label="prev">‹</button>
      <button class="btn btn-ghost btn-sm" id="today" data-i18n="ag.today">Hoje</button>
      <button class="icon-btn" id="next" aria-label="next">›</button>
      <input type="date" id="pick">
    </div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="board" id="board"></div>
  <div class="legend" id="legend"></div>
  <div class="list">
    <h2 data-i18n="ag.list"></h2>
    <div id="online"></div>
    <button class="btn btn-ghost btn-sm" id="reset" data-i18n="ag.reset" style="margin-top:12px"></button>
  </div>
</main>
<div class="tip" id="tip"></div>

<script src="app.js"></script>
<script>
(function () {
  const { t, L } = DS; const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const HH = 64; // px per hour
  let day = DS.todayKey();

  function shift(n) { const d = DS.dateOf(day); d.setDate(d.getDate() + n); day = DS.keyOf(d); render(); }
  $('#prev').onclick = () => shift(-1); $('#next').onclick = () => shift(1);
  $('#today').onclick = () => { day = DS.todayKey(); render(); };
  $('#pick').onchange = (e) => { if (e.target.value) { day = e.target.value; render(); } };

  function render() {
    $('#pick').value = day;
    $('#dLabel').textContent = DS.fmtDate(day, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const h = DS.hoursFor(day);
    const cols = DS.THERAPISTS.map((th) => ({ th, blocks: DS.blocksFor(day, th.id) }));
    const all = cols.flatMap((c) => c.blocks);
    const booked = all.reduce((s, b) => s + b.min, 0);
    const cap = h ? (h[1] - h[0]) * cols.length : 0;
    const occ = cap ? Math.round((booked / cap) * 100) : 0;
    const rev = all.reduce((s, b) => s + b.price, 0);
    const onl = all.filter((b) => b.online).length;
    $('#kpis').innerHTML = [
      [t('ag.k1'), all.length], [t('ag.k2'), occ + '%', occ], [t('ag.k3'), '€' + rev.toLocaleString(DS.locale())], [t('ag.k4'), onl]
    ].map((k) => `<div class="kpi"><span>${k[0]}</span><b>${k[1]}</b>${k[2] != null ? `<div class="bar"><i style="width:${k[2]}%"></i></div>` : ''}</div>`).join('');

    if (!h) { $('#board').innerHTML = `<div class="closed">${t('ag.closed')}</div>`; renderOnline(); return; }
    const hrs = (h[1] - h[0]) / 60; const height = hrs * HH;
    const y = (min) => ((min - h[0]) / 60) * HH;
    let html = `<div class="grid" style="grid-template-columns:64px repeat(${cols.length},1fr)"><div class="colh"></div>`;
    html += cols.map((c) => `<div class="colh"><div class="av">${c.th.name[0]}</div><div><b>${c.th.name}</b><small>${c.blocks.length} · ${L(c.th.tag)}</small></div></div>`).join('');
    let times = ''; for (let m = h[0]; m <= h[1]; m += 60) times += `<div style="top:${y(m) + (m === h[0] ? 8 : 0)}px">${DS.hm(m)}</div>`;
    html += `<div class="times" style="height:${height}px">${times}</div>`;
    const nm = new Date(); const nowM = nm.getHours() * 60 + nm.getMinutes();
    const nowLine = day === DS.todayKey() && nowM > h[0] && nowM < h[1] ? `<div class="now" style="top:${y(nowM)}px"></div>` : '';
    html += cols.map((c) => `<div class="col" style="height:${height}px;--hh:${HH}px">${nowLine}${c.blocks.map((b) => {
      const tr = DS.treat(b.treat);
      return `<div class="blk ${b.online ? 'online' : ''}" style="top:${y(b.start) + 2}px;height:${(b.min / 60) * HH - 4}px;--c:${tr.color}" data-info="${esc(JSON.stringify({ n: L(tr.name), c: b.client, s: DS.hm(b.start) + '–' + DS.hm(b.end), p: b.price, th: c.th.name, o: !!b.online, r: b.ref || '' }))}">
        <b>${esc(b.client)}${b.online ? `<span class="on">${t('ag.online')}</span>` : ''}</b><span>${DS.hm(b.start)} · ${L(tr.name)}</span></div>`;
    }).join('')}</div>`).join('');
    html += '</div>';
    $('#board').innerHTML = html;
    $('#legend').innerHTML = DS.TREATMENTS.map((tr) => `<span><i style="background:${tr.color}"></i>${L(tr.name)}</span>`).join('');
    renderOnline();
  }

  function renderOnline() {
    const list = DS.loadBookings().sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
    $('#online').innerHTML = list.length ? list.map((b) => `<div class="rowb"><div><b>${DS.fmtDate(b.date, { day: 'numeric', month: 'short' })}</b><small>${DS.hm(b.start)}</small></div>
      <div><b>${esc(b.name)}</b> · ${L(DS.treat(b.treat).name)} · ${b.min} min · €${b.price}<small>${DS.therapist(b.therapist).name} · ${esc(b.phone)} · ${b.ref}${b.notes ? ' · “' + esc(b.notes) + '”' : ''}</small></div>
      <button class="x" data-go="${b.date}">${t('ag.today') === 'Hoje' ? 'Ver' : 'View'}</button></div>`).join('') : `<div class="empty">${t('ag.empty')}</div>`;
    $('#reset').hidden = !list.length;
    document.querySelectorAll('[data-go]').forEach((x) => (x.onclick = () => { day = x.dataset.go; render(); scrollTo({ top: 0, behavior: 'smooth' }); }));
  }
  $('#reset').onclick = () => { DS.clearBookings(); render(); };

  const tip = $('#tip');
  document.addEventListener('click', (e) => {
    const b = e.target.closest('.blk');
    if (!b) { tip.style.display = 'none'; return; }
    const i = JSON.parse(b.dataset.info);
    tip.innerHTML = `<b>${esc(i.n)}</b><div>${esc(i.c)}${i.o ? ' · ' + t('ag.online') : ''}</div><div>${i.s} · ${esc(i.th)} · €${i.p}</div>${i.r ? `<div>${i.r}</div>` : ''}`;
    const r = b.getBoundingClientRect(); tip.style.display = 'block';
    tip.style.left = Math.min(innerWidth - 296, Math.max(8, r.left)) + 'px';
    tip.style.top = Math.min(innerHeight - tip.offsetHeight - 8, r.bottom + 8) + 'px';
  });
  addEventListener('scroll', () => (tip.style.display = 'none'), { passive: true });

  DS.onLang(render);
  addEventListener('storage', render);
  DS.applyLang(); render();
})();
</script>
</body>
</html>
